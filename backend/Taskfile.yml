
version: "3"

vars:
  APP: app.main:app

tasks:
  # ==========================================
  # PROJECT SETUP
  # ==========================================

  install:
    desc: Install project dependencies
    cmds:
      - uv sync --all-groups

  init:
    desc: Create project directory structure
    cmds:
      - |
        mkdir -p \
          app/api/routes \
          app/core \
          app/db \
          app/models \
          app/schema \
          app/repositories \
          app/services \
          app/middleware \
          app/utils \
          migrations/versions \
          docs \
          tests/api \
          tests/services \
          tests/repositories \
          .github/workflows

      - |
        touch \
          app/__init__.py \
          app/api/__init__.py \
          app/api/dependencies.py \
          app/api/routes/__init__.py \
          app/api/routes/health.py \
          app/core/__init__.py \
          app/core/security.py \
          app/core/exceptions.py \
          app/core/logging.py \
          app/core/constants.py \
          app/db/__init__.py \
          app/db/init_db.py \
          app/models/__init__.py \
          app/models/user.py \
          app/schema/__init__.py \
          app/schema/user.py \
          app/repositories/__init__.py \
          app/repositories/user.py \
          app/services/__init__.py \
          app/services/user.py \
          app/middleware/__init__.py \
          app/middleware/request_id.py \
          app/middleware/logging.py \
          app/utils/__init__.py \
          app/utils/datetime.py \
          migrations/env.py \
          migrations/script.py.mako \
          docs/architecture.md \
          tests/__init__.py \
          tests/conftest.py \
          tests/api/test_health.py \
          tests/services/test_user.py \
          tests/repositories/test_user.py \
          .github/workflows/ci.yml \
          .env.example \
          .dockerignore \
          Dockerfile \
          compose.yaml

      - echo "Project structure created successfully."

  # ==========================================
  # DEVELOPMENT
  # ==========================================

  dev:
    desc: Start FastAPI development server
    cmds:
      - uv run fastapi dev app/main.py

  worker:
    desc: Start a Celery worker (processes uploaded documents)
    cmds:
      - uv run celery -A app.worker.celery_app worker --loglevel=INFO --queues=documents --concurrency=2

  beat:
    desc: Start Celery beat (schedules recovery of stuck jobs; run exactly one)
    cmds:
      - uv run celery -A app.worker.celery_app beat --loglevel=INFO --schedule=/tmp/docis-celerybeat-schedule

  reindex:
    desc: Rebuild the search index for every processed document
    cmds:
      - uv run python -m app.search.reindex

  start:
    desc: Start FastAPI production server
    cmds:
      - uv run fastapi run app/main.py

  # ==========================================
  # CODE QUALITY
  # ==========================================

  format:
    desc: Format Python code using Ruff
    cmds:
      - uv run ruff format .

  lint:
    desc: Check code quality using Ruff
    cmds:
      - uv run ruff check .

  lint-fix:
    desc: Automatically fix Ruff issues
    cmds:
      - uv run ruff check . --fix

  typecheck:
    desc: Run static type checking
    cmds:
      - uv run mypy .

  # ==========================================
  # TESTING
  # ==========================================

  test:
    desc: Run all tests
    cmds:
      - uv run pytest

  test-cov:
    desc: Run tests with coverage
    cmds:
      - uv run pytest --cov=app --cov-report=term-missing

  test-unit:
    desc: Run unit tests (pure logic, no I/O)
    cmds:
      - uv run pytest -m unit --no-cov {{.CLI_ARGS}}

  test-api:
    desc: Run API tests (HTTP layer, database mocked)
    cmds:
      - uv run pytest -m api --no-cov {{.CLI_ARGS}}

  test-integration:
    desc: Run integration tests (SQLite, filesystem, OCR, worker; PostgreSQL if TEST_POSTGRES_URL is set)
    cmds:
      - uv run pytest -m integration --no-cov {{.CLI_ARGS}}

  test-e2e:
    desc: Run end-to-end workflow tests (whole app, real database, in-process worker)
    cmds:
      - uv run pytest -m e2e --no-cov {{.CLI_ARGS}}

  test-postgres:
    desc: Run PostgreSQL + pgvector tests against a *_test database (default docis_test in Docker)
    env:
      TEST_POSTGRES_URL: '{{.TEST_POSTGRES_URL | default "postgresql+asyncpg://docis:docis@localhost:5434/docis_test"}}'
    cmds:
      - uv run pytest -m postgres --no-cov {{.CLI_ARGS}}

  test-report:
    desc: Full test run for the deliverables (every opt-in test, backend + frontend); saves reports in test-results/ and prints a Markdown summary
    env:
      TEST_POSTGRES_URL: '{{.TEST_POSTGRES_URL | default "postgresql+asyncpg://docis:docis@localhost:5434/docis_test"}}'
      RUN_EMBEDDING_TESTS: "1"
    cmds:
      - mkdir -p test-results ../frontend/test-results
      - >-
        uv run pytest
        --junitxml=test-results/backend-junit.xml
        --cov=app --cov-report=term
        --cov-report=xml:test-results/coverage.xml
        --cov-report=html:test-results/coverage-html
      - cd ../frontend && npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/frontend-junit.xml
      - uv run python scripts/test_report.py

  pdf:
    desc: Convert deliverables.md (repository root) to deliverables.pdf, with Mermaid diagrams drawn (needs mmdc, pandoc and Chrome)
    cmds:
      - sh scripts/deliverables-pdf.sh {{.CLI_ARGS}}

  # ==========================================
  # EXTRACTION ACCURACY (T4.2)
  # ==========================================

  eval-generate:
    desc: Generate the synthetic labelled invoices and validation expectations
    cmds:
      - uv run python -m evaluation generate --count {{.COUNT | default 40}}

  eval-check:
    desc: Check the evaluation harness (oracle model; free, expect 100%)
    cmds:
      - uv run python -m evaluation run --llm oracle

  eval:
    desc: Measure extraction accuracy with Claude (costs money; needs ANTHROPIC_API_KEY)
    cmds:
      - uv run python -m evaluation run --llm claude --yes {{.CLI_ARGS}}

  eval-validate:
    desc: Measure how well the amount checks catch inconsistent invoices (free)
    cmds:
      - uv run python -m evaluation validate

  eval-ocr:
    desc: Measure OCR on skewed, blurred, low-res, dark and noisy images (synthetic; free)
    cmds:
      - uv run python -m evaluation ocr {{.CLI_ARGS}}

  eval-3p-ocr:
    desc: OCR on poor images, plus the third-party photos and scans by defect (free)
    cmds:
      - uv run python -m evaluation ocr --dataset evaluation/third_party_eval/dataset --out evaluation/third_party_eval/results {{.CLI_ARGS}}

  eval-report:
    desc: Rebuild the HTML evaluation reports (synthetic and third-party)
    cmds:
      - uv run python -m evaluation report
      - uv run python -m evaluation report --results evaluation/third_party_eval/results

  # Third-party dataset in evaluation/third_party (converted to third_party_eval/)
  eval-3p-convert:
    desc: Convert evaluation/third_party into the evaluation layout
    cmds:
      - uv run python -m evaluation convert-third-party

  eval-3p-validate:
    desc: Amount-check evaluation on the third-party dataset (free)
    cmds:
      - uv run python -m evaluation validate --dataset evaluation/third_party_eval/dataset --out evaluation/third_party_eval/results

  eval-3p-check:
    desc: Harness check on the third-party dataset (oracle; free, expect ~100%)
    cmds:
      - uv run python -m evaluation run --llm oracle --dataset evaluation/third_party_eval/dataset --out evaluation/third_party_eval/results

  eval-3p:
    desc: Extraction accuracy on the third-party dataset with Claude (costs money)
    cmds:
      - uv run python -m evaluation run --llm claude --yes --dataset evaluation/third_party_eval/dataset --out evaluation/third_party_eval/results {{.CLI_ARGS}}

  reconcile-generate:
    desc: Write labelled PDF-PDF and PDF-Excel comparison pairs (free)
    cmds:
      - uv run python -m evaluation reconcile-generate {{.CLI_ARGS}}

  reconcile:
    desc: Measure cross-document comparison on the labelled pairs (free; --extraction claude costs money)
    cmds:
      - uv run python -m evaluation reconcile {{.CLI_ARGS}}

  # ==========================================
  # DATABASE
  # ==========================================

  db-revision:
    desc: Generate Alembic migration
    cmds:
      - uv run alembic revision --autogenerate -m "{{.MSG}}"
    requires:
      vars: [MSG]

  db-upgrade:
    desc: Apply database migrations
    cmds:
      - uv run alembic upgrade head

  db-downgrade:
    desc: Roll back one migration
    cmds:
      - uv run alembic downgrade -1

  db-check:
    desc: Fail if models and migrations are out of sync
    cmds:
      - uv run alembic check

  db-history:
    desc: Show migration history
    cmds:
      - uv run alembic history

  db-current:
    desc: Show current database revision
    cmds:
      - uv run alembic current

  # ==========================================
  # DOCKER
  # ==========================================

  docker-up:
    desc: Start Docker Compose services
    cmds:
      - docker compose up -d --build

  docker-down:
    desc: Stop Docker Compose services
    cmds:
      - docker compose down

  docker-logs:
    desc: Follow Docker Compose logs
    cmds:
      - docker compose logs -f

  # ==========================================
  # UTILITIES
  # ==========================================

  tree:
    desc: Display project structure
    cmds:
      - tree -L 4 -I '.venv|__pycache__|.git'

  clean:
    desc: Remove Python cache files
    cmds:
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - find . -type f -name '*.pyc' -delete

  # ==========================================
  # COMPLETE QUALITY CHECK
  # ==========================================

  check:
    desc: Run all code quality checks and tests
    cmds:
      - task: format
      - task: lint
      - task: typecheck
      - task: test

  ci:
    desc: Run CI checks without modifying source files
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run mypy .
      - uv run pytest
