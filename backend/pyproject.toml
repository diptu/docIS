
[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend application"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.10.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.7.0",
    "fastapi[standard]>=0.165.0",
    "fastembed>=0.9.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "sqlalchemy[asyncio]>=2.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "celery-types>=0.26.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pylint>=4.1.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
    "types-openpyxl>=3.1.5.20261017",
]

# --------------------------------------------------
# PYTEST
# --------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Fail (with a stack dump of every thread) instead of hanging forever.
timeout = 60
timeout_method = "thread"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]

markers = [
    "unit: pure logic in isolation (tests/unit)",
    "api: HTTP layer with the database and services mocked (tests/api)",
    "integration: real database, filesystem, OCR or worker (tests/integration)",
    "e2e: client workflows through the whole application (tests/e2e)",
    "postgres: needs a real PostgreSQL with pgvector (set TEST_POSTGRES_URL)",
    "embeddings: uses the real local embedding model (downloads ~64 MB once)",
]

# --------------------------------------------------
# MYPY
# --------------------------------------------------

[tool.mypy]
python_version = "3.11"
mypy_path = "."
strict = true
plugins = ["pydantic.mypy"]

warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

show_error_codes = true
pretty = true

exclude = [
    "^tests/",
]

# --------------------------------------------------
# PYLINT
# --------------------------------------------------

[tool.pylint.main]
py-version = "3.11"
recursive = true
jobs = 0

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 7
max-attributes = 10
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50

# --------------------------------------------------
# RUFF
# --------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]
exclude = [
    ".venv",
    "__pycache__",
    "htmlcov",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
]

ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Assertions are expected in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[[tool.mypy.overrides]]
module = ["xlrd", "xlrd.*", "pytesseract", "pytesseract.*", "pypdfium2", "pypdfium2.*", "pgvector", "pgvector.*", "fastembed", "fastembed.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs on greenlets; without this, coverage loses
# track of code that resumes after a database await.
concurrency = ["greenlet", "thread"]
